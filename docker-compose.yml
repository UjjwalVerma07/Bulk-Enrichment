# version: '3.8'
networks:
  airflow_network:
    driver: bridge
services:


  # Note: Marquez is running separately in ./marquez/ directory
  # Connect to it via http://localhost:5000 (API) and http://localhost:3000 (UI)


  # Airflow Metadata Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - airflow_network

#You need to install the openlineage in the airflow containers as 

  #Init services
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW_WEBSERVER_SECRET_KEY: 'my_shared_secret_key'
    volumes:
      - ./orchestrator/dags:/opt/airflow/dags/orchestrator
      - ./orchestrator/config:/opt/airflow/dags/config
      - ./common/libs:/opt/airflow/common/libs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./email_validation:/opt/airflow/dags/email_validation
      - ./reverse_geocode/dags:/opt/airflow/dags/reverse_geocode
      # - ./gender_enrichment/dags:/opt/airflow/dags/gender_enrichment
      # - ./common/libs:/opt/airflow/common/libs
      # - ./samples/input:/samples/input
      # - ./samples/output:/samples/output
      # - ./gender_enrichment/data:/gender_enrichment/data
      # - ./reverse_geocode/data:/reverse_geocode/data
    command: >
      bash -c "
        airflow db upgrade &&
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
      "
    networks:
      - airflow_network

  # Airflow Scheduler & Webserver
  airflow-webserver:
    # image: apache/airflow:2.9.2
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - mailhog
    environment:
      OPENLINEAGE_URL: http://host.docker.internal:5000
      OPENLINEAGE_NAMESPACE: airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ''
      AIRFLOW__CORE__LOAD_EXAMPLES: 'true'
      AIRFLOW__WEBSERVER__RBAC: 'true'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__WEBSERVER__SECRET_KEY: 'my_shared_secret_key'
      PYTHONPATH: /opt/airflow
      
      # MailHog SMTP Configuration
      AIRFLOW__SMTP__SMTP_HOST: mailhog
      AIRFLOW__SMTP__SMTP_STARTTLS: 'False'
      AIRFLOW__SMTP__SMTP_SSL: 'False'
      AIRFLOW__SMTP__SMTP_PORT: 1025
      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@example.com

    volumes:
      - ./orchestrator/dags:/opt/airflow/dags/orchestrator
      - ./orchestrator/config:/opt/airflow/dags/config
      - ./common/libs:/opt/airflow/common/libs
      - /var/run/docker.sock:/var/run/docker.sock
      - ./reverse_geocode/data:/reverse_geocode/data
      - ./reverse_geocode/data:/reverse_geocode/data
      - ./email_validation/dags:/opt/airflow/dags/email_validation
      # - ./email_validation/cpp:/opt/airflow/dags/email_validation/cpp
      # - ./email_validation/scripts:/opt/airflow/dags/email_validation/scripts



      # - ./email_validation:/opt/airflow/dags/email_validation #(We are Trying this one)
      - ./reverse_geocode/dags:/opt/airflow/dags/reverse_geocode
      - ./gender_enrichment/dags:/opt/airflow/dags/gender_enrichment
      # - ./common/libs:/opt/airflow/common/libs
      # - ./samples/input:/samples/input
      # - ./samples/output:/samples/output
      # - ./gender_enrichment/data:/gender_enrichment/data
      # - ./reverse_geocode/data:/reverse_geocode/data
      # - ./tmp:/tmp
    ports:
      - "8080:8080"
    command: webserver
    networks:
      - airflow_network

  airflow-scheduler:
    # image: apache/airflow:2.9.2
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - mailhog
    environment:
      OPENLINEAGE_URL: http://host.docker.internal:5000
      OPENLINEAGE_NAMESPACE: airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: 'my_shared_secret_key'
      PYTHONPATH: /opt/airflow
      # MailHog SMTP Configuration
      AIRFLOW__SMTP__SMTP_HOST: mailhog
      AIRFLOW__SMTP__SMTP_STARTTLS: 'False'
      AIRFLOW__SMTP__SMTP_SSL: 'False'
      AIRFLOW__SMTP__SMTP_PORT: 1025
      AIRFLOW__SMTP__SMTP_MAIL_FROM: airflow@example.com
    volumes:
      - ./orchestrator/dags:/opt/airflow/dags/orchestrator
      - ./orchestrator/config:/opt/airflow/dags/config
      - ./common/libs:/opt/airflow/common/libs
      - ./reverse_geocode/data:/reverse_geocode/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./email_validation/dags:/opt/airflow/dags/email_validation
      # - ./email_validation/cpp:/opt/airflow/dags/email_validation/cpp
      # - ./email_validation/scripts:/opt/airflow/dags/email_validation/scripts


      # - ./email_validation:/opt/airflow/dags/email_validation #(We are Trying this one)
      - ./reverse_geocode/dags:/opt/airflow/dags/reverse_geocode
      - ./gender_enrichment/dags:/opt/airflow/dags/gender_enrichment
      # - ./common/libs:/opt/airflow/common/libs
      # - ./samples/input:/samples/input
      # - ./samples/output:/samples/output
      # - ./gender_enrichment/data:/gender_enrichment/data
      # - ./reverse_geocode/data:/reverse_geocode/data
      # - ./tmp:/tmp
    command: scheduler
    networks:
      - airflow_network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - airflow_network

  # MailHog (Email Testing Server)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP port
      - "8025:8025"  # Web UI port
    networks:
      - airflow_network

  # Kafka + Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - airflow_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    depends_on:
      - zookeeper
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - airflow_network

#Custom images (For Docker Operator)
  email_validation:
    build:
      context: .
      dockerfile: email_validation/Dockerfile
    image: email_validation_image
    volumes:
      - ./email_validation:/opt/airflow/dags/email_validation
      - ./samples/input:/samples/input
      - ./samples/output:/samples/output
    networks:
      - airflow_network

  reverse_geocode:
    build:
      context: .
      dockerfile: reverse_geocode/Dockerfile
    image: reverse_geocode_image
    volumes:
      - ./reverse_geocode:/opt/airflow/dags/reverse_geocode
      - ./reverse_geocode/data:/reverse_geocode/data
      - ./samples/input:/samples/input
      - ./samples/output:/samples/output
    networks:
      - airflow_network

  gender_enrichment:
    build:
      context: .
      dockerfile: gender_enrichment/Dockerfile
    image: gender_enrichment_image
    volumes:
      - ./gender_enrichment:/opt/airflow/dags/gender_enrichment
      - ./gender_enrichment/data:/gender_enrichment/data
      - ./samples/input:/samples/input
      - ./samples/output:/samples/output
    networks:
      - airflow_network


volumes:
  postgres_data:
  minio_data:




